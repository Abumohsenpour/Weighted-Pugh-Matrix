<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weighted Pugh Matrix</title>
<!-- html2canvas: local copy first, CDN fallback if this file is opened on its own -->
<script src="vendor/html2canvas.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';document.head.appendChild(s)"></script>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --line: #e3e7ee;
    --line-strong: #cfd6e1;
    --head: #f8fafc;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbe6fd;
    --pill: #e5e9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Vazirmatn, Tahoma, sans-serif;
    padding: 24px 16px;
  }
  .toolbar {
    max-width: 1400px; margin: 0 auto 14px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .toolbar h1 { font-size: 18px; margin: 0 auto 0 0; }
  .btn {
    border: 1px solid var(--line-strong); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }

  .scroll { max-width: 1400px; margin: 0 auto; overflow-x: auto; }
  #matrix {
    display: inline-block; min-width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 10px 12px; text-align: center; vertical-align: middle; }
  th:last-child, td:last-child { border-right: 0; }
  thead th { background: var(--head); vertical-align: top; }
  .hlabel { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .del {
    border: 0; background: none; color: #9ca3af; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px;
  }
  .del:hover { color: #dc2626; }
  .col-x { width: 34px; padding: 0; }

  .name {
    border: 1px solid transparent; background: transparent; font: inherit; color: inherit;
    border-radius: 4px; padding: 3px 5px; width: 100%; min-width: 90px; display: inline-block;
  }
  .name:hover { border-color: var(--line); }
  .name:focus { outline: none; border-color: var(--accent); background: #fff; }
  th .name { width: auto; flex: 1 1 auto; text-align: center; font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: .02em; }
  td.concept { text-align: start; min-width: 150px; }
  td.concept .name { font-weight: 600; }

  .crit-head { display: flex; align-items: center; gap: 2px; }
  .weight { margin-top: 6px; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .w {
    display: inline-block;
    width: 52px; text-align: center; font: inherit; font-weight: 700; color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 2px; background: #fff;
  }
  .w:focus { outline: none; border-color: var(--accent); }

  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; background: #fff; }
  .seg > *:first-child { border-radius: 999px 0 0 999px; }
  .seg > * {
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-right: 1px solid var(--line); background: none; font: inherit; font-size: 12px;
    width: 26px; height: 22px; cursor: pointer; color: var(--text); padding: 0;
  }
  .seg > *:last-child { border-right: 0; border-radius: 0 999px 999px 0; }
  .seg > *:hover { background: #eef2f7; }
  .seg > .on { background: var(--pill); font-weight: 700; }
  .seg > .on.hi { background: var(--accent); color: #fff; }

  th.total-h { min-width: 130px; }
  td.total { background: var(--head); }
  .score {
    display: inline-block; min-width: 38px; padding: 3px 12px; border-radius: 999px;
    background: var(--pill); font-weight: 700;
  }
  .score.win { background: var(--accent); color: #fff; }
  .badge {
    display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .pct { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

  .add-col { width: 44px; padding: 8px 4px; }
  .circle {
    width: 26px; height: 26px; border-radius: 50%; border: 1px dashed var(--line-strong);
    background: #fff; color: var(--muted); font-size: 16px; cursor: pointer; line-height: 1;
  }
  .circle:hover { border-color: var(--accent); color: var(--accent); }
  tfoot td { background: var(--head); border-bottom: 0; }
  tfoot .add-row { text-align: start; }
  .foot-note { font-size: 11px; color: var(--muted); }

  /* Applied to the clone used for the screenshot */
  .capturing .ctl { display: none !important; }
  .capturing .seg > :not(.on) { color: #9ca3af; }
  /* html2canvas mis-renders inline-flex children: use inline-blocks in the capture */
  .capturing .seg { display: inline-block; white-space: nowrap; font-size: 0; line-height: 0; vertical-align: middle; }
  .capturing .seg > * { display: inline-block; font-size: 12px; line-height: 22px; text-align: center; vertical-align: top; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Weighted Pugh Matrix</h1>
  <button class="btn" id="addConcept">+ Concept</button>
  <button class="btn" id="addCriterion">+ Criterion</button>
  <button class="btn" id="reset">Reset</button>
  <button class="btn primary" id="shot">📷 Screenshot</button>
</div>

<div class="scroll">
  <div id="matrix"></div>
</div>

<div id="toast"></div>

<script>
/*
 * Weighted Pugh matrix
 *   rows    = concepts that passed screening
 *   columns = agreed criteria (parameters) with final weight Wᵢ
 *   score   = 1..5 per (concept, criterion)
 *   total   = Σ Wᵢ · scoreᵢ
 */
const STORAGE_KEY = 'weighted-pugh-matrix-v1';
// Aspect ratio of the reference image (895 × 261)
const SHOT_RATIO = 895 / 261;
const SHOT_SCALE = 3;

const DEFAULT_STATE = () => ({
  criteria: ['Cost', 'Performance', 'Ease of Use', 'Reliability', 'Scalability'].map(n => ({ id: uid(), name: n, weight: 3 })),
  concepts: ['Concept A', 'Concept B', 'Concept C'].map(n => ({ id: uid(), name: n })),
  scores: {}, // key `${conceptId}|${criterionId}` -> 1..5
});

function uid() { return Math.random().toString(36).slice(2, 9); }

let state = load() || DEFAULT_STATE();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && Array.isArray(s.criteria) && Array.isArray(s.concepts)) return s;
  } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function getScore(cid, kid) { return state.scores[cid + '|' + kid] ?? 3; }

function totals() {
  return state.concepts.map(c =>
    state.criteria.reduce((sum, k) => sum + (Number(k.weight) || 0) * getScore(c.id, k.id), 0));
}
function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, ''); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function totalCell(total, max, maxPossible) {
  const win = total === max && max > 0;
  return `<span class="score${win ? ' win' : ''}">${fmt(total)}</span>`
    + (maxPossible ? `<span class="pct">${fmt(Math.round(total / maxPossible * 1000) / 10)}%</span>` : '')
    + (win ? '<div><span class="badge">★ WINNER</span></div>' : '');
}
function footNote(weightSum) {
  return `ΣWᵢ = ${fmt(weightSum)} · scores 1–5 · max possible = ${fmt(weightSum * 5)}`;
}

function render() {
  const t = totals();
  const max = t.length ? Math.max(...t) : 0;
  const weightSum = state.criteria.reduce((s, k) => s + (Number(k.weight) || 0), 0);
  const maxPossible = weightSum * 5;

  let h = '<table><thead><tr>';
  h += '<th class="col-x ctl"></th>';
  h += '<th style="text-align:start"><span class="hlabel">Concept</span></th>';
  for (const k of state.criteria) {
    h += `<th data-k="${k.id}">
      <div class="crit-head">
        <input class="name" dir="auto" data-role="kname" size="${Math.max(8, k.name.length + 1)}" value="${esc(k.name)}">
        <button class="del ctl" title="Remove criterion" data-role="kdel">×</button>
      </div>
      <div class="weight">Wᵢ
        <input class="w" type="number" min="0" step="any" data-role="kw" value="${esc(k.weight)}">
      </div>
    </th>`;
  }
  h += '<th class="total-h"><span class="hlabel">Weighted Total</span></th>';
  h += '<th class="add-col ctl"><button class="circle" title="Add criterion" data-role="addk">+</button></th>';
  h += '</tr></thead><tbody>';

  state.concepts.forEach((c, i) => {
    h += `<tr data-c="${c.id}">`;
    h += '<td class="col-x ctl"><button class="del" title="Remove concept" data-role="cdel">×</button></td>';
    h += `<td class="concept"><input class="name" dir="auto" data-role="cname" value="${esc(c.name)}"></td>`;
    for (const k of state.criteria) {
      const v = getScore(c.id, k.id);
      h += `<td><div class="seg" data-k="${k.id}">`;
      for (let s = 1; s <= 5; s++) {
        h += `<button data-role="score" data-s="${s}" class="${s === v ? 'on' : ''}">${s}</button>`;
      }
      h += '</div></td>';
    }
    h += `<td class="total">${totalCell(t[i], max, maxPossible)}</td>`;
    h += '<td class="add-col ctl"></td></tr>';
  });

  h += '</tbody><tfoot><tr>';
  h += '<td class="col-x ctl"></td>';
  h += '<td class="add-row"><button class="circle ctl" title="Add concept" data-role="addc">+</button></td>';
  h += `<td colspan="${state.criteria.length}" class="foot-note">${footNote(weightSum)}</td>`;
  h += '<td></td><td class="add-col ctl"></td>';
  h += '</tr></tfoot></table>';

  document.getElementById('matrix').innerHTML = h;
  save();
}

// Update totals in place (keeps focus and caret while typing a weight)
function refreshTotals() {
  const t = totals();
  const max = t.length ? Math.max(...t) : 0;
  const weightSum = state.criteria.reduce((s, k) => s + (Number(k.weight) || 0), 0);
  matrix.querySelectorAll('tbody td.total').forEach((td, i) => { td.innerHTML = totalCell(t[i], max, weightSum * 5); });
  matrix.querySelector('.foot-note').textContent = footNote(weightSum);
  save();
}

const matrix = document.getElementById('matrix');

matrix.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const k = b.closest('[data-k]')?.dataset.k;
  const c = b.closest('[data-c]')?.dataset.c;
  switch (b.dataset.role) {
    case 'score': state.scores[c + '|' + k] = Number(b.dataset.s); break;
    case 'kdel': state.criteria = state.criteria.filter(x => x.id !== k); break;
    case 'cdel': state.concepts = state.concepts.filter(x => x.id !== c); break;
    case 'addk': addCriterion(); return;
    case 'addc': addConcept(); return;
    default: return;
  }
  render();
});

matrix.addEventListener('input', e => {
  const el = e.target;
  const k = el.closest('[data-k]')?.dataset.k;
  const c = el.closest('[data-c]')?.dataset.c;
  if (el.dataset.role === 'kname') { state.criteria.find(x => x.id === k).name = el.value; save(); }
  else if (el.dataset.role === 'cname') { state.concepts.find(x => x.id === c).name = el.value; save(); }
  else if (el.dataset.role === 'kw') {
    state.criteria.find(x => x.id === k).weight = el.value === '' ? '' : Math.max(0, Number(el.value));
    refreshTotals();
  }
});

function addCriterion() {
  state.criteria.push({ id: uid(), name: 'Criterion ' + (state.criteria.length + 1), weight: 1 });
  render();
  const inputs = matrix.querySelectorAll('[data-role="kname"]');
  inputs[inputs.length - 1]?.select();
}
function addConcept() {
  state.concepts.push({ id: uid(), name: 'Concept ' + String.fromCharCode(65 + state.concepts.length % 26) });
  render();
  const inputs = matrix.querySelectorAll('[data-role="cname"]');
  inputs[inputs.length - 1]?.select();
}

document.getElementById('addCriterion').onclick = addCriterion;
document.getElementById('addConcept').onclick = addConcept;
document.getElementById('reset').onclick = () => {
  if (confirm('Reset the matrix to the default example?')) { state = DEFAULT_STATE(); render(); }
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Screenshot at the reference aspect ratio ----------
async function screenshot() {
  if (!window.html2canvas) { toast('Screenshot library failed to load (offline?)'); return; }
  const src = document.getElementById('matrix');
  const shot = await html2canvas(src, {
    scale: SHOT_SCALE,
    backgroundColor: null,
    onclone: doc => {
      const m = doc.getElementById('matrix');
      m.classList.add('capturing');
      // Show the full table even if it is horizontally scrolled on screen
      m.parentElement.style.overflow = 'visible';
      m.parentElement.style.maxWidth = 'none';
      m.style.width = 'max-content';
      // Inputs and buttons render unreliably in html2canvas: swap them for styled spans
      m.querySelectorAll('input, .seg button').forEach(el => {
        const span = doc.createElement('span');
        span.textContent = el.tagName === 'INPUT' ? el.value : el.textContent;
        span.className = el.className;
        span.dir = 'auto';
        el.replaceWith(span);
      });
    },
  });

  // Letterbox the capture onto a canvas with the exact reference ratio
  const pad = 8 * SHOT_SCALE;
  const cw = shot.width + pad * 2, ch = shot.height + pad * 2;
  let W, H;
  if (cw / ch > SHOT_RATIO) { W = cw; H = Math.round(cw / SHOT_RATIO); }
  else { H = ch; W = Math.round(ch * SHOT_RATIO); }
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor || '#f4f6fa';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(shot, Math.round((W - shot.width) / 2), Math.round((H - shot.height) / 2));

  out.toBlob(async blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pugh-matrix.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    let copied = false;
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } catch (e) {}
    toast(`Saved ${W}×${H} PNG` + (copied ? ' · copied to clipboard' : ''));
  }, 'image/png');
}
document.getElementById('shot').onclick = screenshot;

render();
</script>
</body>
</html>
